services:
  postgres:
    image: postgres:16
    container_name: ignite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ignite
      POSTGRES_PASSWORD: ignite_dev
      POSTGRES_DB: ignite
    ports:
      - "5432:5432"
    volumes:
      - ignite_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignite -d ignite"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ignite_postgres_data:
